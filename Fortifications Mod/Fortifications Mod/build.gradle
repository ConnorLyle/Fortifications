plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}
dependencies {
    implementation "curse.maven:architectury-api-419699:5553800"
    implementation "curse.maven:ftb-library-forge-404465:7746959"
    implementation "curse.maven:ftb-teams-forge-404468:7878281"
    implementation "curse.maven:ftb-chunks-forge-314906:7608681"
    compileOnly files('../../mods/irons_spellbooks-1.21.1-3.16.2.jar')
    compileOnly files('../../mods/gametechbcs_spellbooks-3.0.0-1.21.1.jar')
    compileOnly files('../../mods/gtbcs_geomancy_plus-1.1.0-1.21.1.jar')
    compileOnly files('../../mods/tunes_n_tomes-1.1.0-HOTFIX.jar')
    compileOnly files('../../mods/relics-1.21.1-0.12.8.jar')
    compileOnly files('../../mods/curios-neoforge-9.5.1+1.21.1.jar')
    compileOnly files('../../mods/puffish_skills-0.18.3-1.21-neoforge.jar')
}

var fortChestTeamAccessTest = tasks.register('fortChestTeamAccessTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.example.fortifications.FortChestTeamAccessTest'
}

