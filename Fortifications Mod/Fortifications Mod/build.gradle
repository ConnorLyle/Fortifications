tasks.named('check') {
    dependsOn fortChestTeamAccessTest, rosterHealthTest, spectatorCycleTest,
            attackerTerrainPlanTest, journeyMapPrivacyTest, rapidBreakRuleTest, friendlyFireTest,
            classResetPolicyTest, teamChatPrefixPolicyTest, lootrProtectionPolicyTest, bannedItemRegistryTest,
            warDayLegalitySearchTest
}

tasks.named('test', Test) {
    failOnNoDiscoveredTests = false
}

// Inject gradle.properties values into neoforge.mods.toml at build time
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_version            : project.mod_version,
        mod_authors            : project.mod_authors,
        neoforge_version_range : project.neoforge_version_range,
        minecraft_version_range: project.minecraft_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}
